name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install Capacitor
        run: |
          npm install
          npx cap --version
          
      - name: Remove old android
        run: rm -rf android
          
      - name: Init Capacitor
        run: npx cap init PhotoCraftPro com.photocraft.pro --web-dir=docs
          
      - name: Add Android
        run: npx cap add android
          
      - name: Sync
        run: npx cap sync android
          
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PhotoCraftPro
          path: android/app/build/outputs/apk/debug/app-debug.apk
