name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install Capacitor
        run: |
          npm install -g @capacitor/cli@5.7.8
          npm install @capacitor/core@5.7.8 @capacitor/android@5.7.8
          
      - name: Remove old Android project if exists
        run: rm -rf android
          
      - name: Init Capacitor project
        run: npx cap init "PhotoCraftPro" "com.photocraft.pro" --web-dir=docs
          
      - name: Add Android platform
        run: npx cap add android
          
      - name: Copy our icons to Android project
        run: |
          rm -rf android/app/src/main/res/mipmap-*
          
          mkdir -p android/app/src/main/res/mipmap-mdpi
          mkdir -p android/app/src/main/res/mipmap-hdpi
          mkdir -p android/app/src/main/res/mipmap-xhdpi
          mkdir -p android/app/src/main/res/mipmap-xxhdpi
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi
          
          cp docs/assets/icon-app-48.png android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          cp docs/assets/icon-app-48.png android/app/src/main/res/mipmap-mdpi/ic_launcher_round.png
          
          cp docs/assets/icon-app-72.png android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          cp docs/assets/icon-app-72.png android/app/src/main/res/mipmap-hdpi/ic_launcher_round.png
          
          cp docs/assets/icon-app-96.png android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          cp docs/assets/icon-app-96.png android/app/src/main/res/mipmap-xhdpi/ic_launcher_round.png
          
          cp docs/assets/icon-app-144.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          cp docs/assets/icon-app-144.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png
          
          cp docs/assets/icon-app-192.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          cp docs/assets/icon-app-192.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png
          
      - name: Sync Capacitor
        run: npx cap sync android
          
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 33
          build-tools: 33.0.0
          
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PhotoCraftPro-Debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          compression-level: 0
          if-no-files-found: error
