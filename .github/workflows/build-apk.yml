name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install Capacitor
        run: |
          npm install -g @capacitor/cli
          npm install @capacitor/core @capacitor/android
          
      - name: Init Capacitor
        run: |
          npx cap init "PhotoCraftPro" "com.photocraft.pro" --web-dir=docs
          npx cap add android
          
      - name: Fix AndroidManifest icons
        run: |
          if [ -f "android/app/src/main/AndroidManifest.xml" ]; then
            echo "✅ AndroidManifest.xml found"
            sed -i 's|android:icon="@mipmap/ic_launcher"|android:icon="@mipmap/ic_launcher"|g' android/app/src/main/AndroidManifest.xml
            echo "✅ AndroidManifest.xml fixed"
          else
            echo "❌ AndroidManifest.xml NOT FOUND!"
            exit 1
          fi
          
      - name: Copy app icons to Android project
        run: |
          mkdir -p android/app/src/main/res/mipmap-mdpi
          mkdir -p android/app/src/main/res/mipmap-hdpi
          mkdir -p android/app/src/main/res/mipmap-xhdpi
          mkdir -p android/app/src/main/res/mipmap-xxhdpi
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi
          
          sudo apt-get update
          sudo apt-get install -y imagemagick
          
          convert docs/assets/icon-app-512.png -resize 48x48 android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          convert docs/assets/icon-app-512.png -resize 48x48 android/app/src/main/res/mipmap-mdpi/ic_launcher_round.png
          
          convert docs/assets/icon-app-512.png -resize 72x72 android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          convert docs/assets/icon-app-512.png -resize 72x72 android/app/src/main/res/mipmap-hdpi/ic_launcher_round.png
          
          convert docs/assets/icon-app-512.png -resize 96x96 android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          convert docs/assets/icon-app-512.png -resize 96x96 android/app/src/main/res/mipmap-xhdpi/ic_launcher_round.png
          
          convert docs/assets/icon-app-512.png -resize 144x144 android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          convert docs/assets/icon-app-512.png -resize 144x144 android/app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png
          
          convert docs/assets/icon-app-512.png -resize 192x192 android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          convert docs/assets/icon-app-512.png -resize 192x192 android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png
          
      - name: Create adaptive icon
        run: |
          mkdir -p android/app/src/main/res/mipmap-anydpi-v26
          echo '<?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background"/>
              <foreground android:drawable="@mipmap/ic_launcher_foreground"/>
          </adaptive-icon>' > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          
          mkdir -p android/app/src/main/res/values
          echo '<?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_launcher_background">#3b82f6</color>
          </resources>' > android/app/src/main/res/values/ic_launcher_background.xml
          
      - name: Sync files
        run: npx cap sync android
          
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 33
          build-tools: 33.0.0
          
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PhotoCraftPro-Debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          compression-level: 0
          if-no-files-found: error
