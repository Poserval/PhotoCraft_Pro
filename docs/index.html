<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>PhotoCraft Pro — Тест сохранения</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, sans-serif;
            background: #f3f4f6;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: white;
            border-radius: 24px;
            padding: 20px;
        }
        .preview-area {
            background: #f3f4f6;
            border: 2px dashed #d1d5db;
            border-radius: 20px;
            aspect-ratio: 3 / 4;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            margin-bottom: 16px;
            overflow: hidden;
        }
        .preview-placeholder {
            text-align: center;
            color: #6b7280;
        }
        .preview-placeholder-icon { font-size: 48px; margin-bottom: 8px; }
        .preview-image {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }
        .file-info {
            font-size: 12px;
            color: #6b7280;
            text-align: center;
            margin-bottom: 16px;
        }
        .input-group { margin-bottom: 16px; }
        .input-group label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: #374151;
            margin-bottom: 6px;
        }
        .input-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            font-size: 16px;
        }
        .save-btn {
            width: 100%;
            padding: 14px;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }
        .status {
            margin-top: 16px;
            padding: 12px;
            border-radius: 12px;
            text-align: center;
            font-size: 14px;
            display: none;
        }
        .status.success { background: #d1fae5; color: #065f46; display: block; }
        .status.error { background: #fee2e2; color: #991b1b; display: block; }
    </style>
</head>
<body>
<div class="container">
    <h2 style="text-align:center; margin-bottom:16px;">📸 Тест сохранения</h2>
    
    <div id="uploadZone" class="preview-area">
        <div id="previewPlaceholder" class="preview-placeholder">
            <div class="preview-placeholder-icon">📸</div>
            <div>Нажмите для загрузки</div>
        </div>
        <img id="previewImg" class="preview-image" style="display: none;" alt="preview">
    </div>
    <div id="fileInfo" class="file-info"></div>

    <div class="input-group">
        <label>Имя файла:</label>
        <input type="text" id="fileName" value="photo">
    </div>

    <button class="save-btn" id="saveBtn">💾 Сохранить изображение</button>
    <div id="status" class="status"></div>
</div>

<script>
    const uploadZone = document.getElementById('uploadZone');
    const previewImg = document.getElementById('previewImg');
    const previewPlaceholder = document.getElementById('previewPlaceholder');
    const fileInfoDiv = document.getElementById('fileInfo');
    const fileNameInput = document.getElementById('fileName');
    const saveBtn = document.getElementById('saveBtn');
    const statusDiv = document.getElementById('status');
    
    let currentImageData = null;
    
    function showStatus(message, isError = false) {
        statusDiv.textContent = message;
        statusDiv.className = isError ? 'status error' : 'status success';
        setTimeout(() => {
            statusDiv.style.display = 'none';
        }, 3000);
    }
    
    // === ПРЯМОЕ СОХРАНЕНИЕ ЧЕРЕЗ ИСПОЛЬЗОВАНИЕ ИНТЕНТА ===
    function saveImage() {
        if (!currentImageData) {
            showStatus('❌ Сначала загрузите изображение', true);
            return;
        }
        
        const fileName = fileNameInput.value.trim() || 'photo';
        
        // Создаём объект Blob из base64
        const byteCharacters = atob(currentImageData.split(',')[1]);
        const byteNumbers = new Array(byteCharacters.length);
        for (let i = 0; i < byteCharacters.length; i++) {
            byteNumbers[i] = byteCharacters.charCodeAt(i);
        }
        const byteArray = new Uint8Array(byteNumbers);
        const blob = new Blob([byteArray], { type: 'image/jpeg' });
        
        // Создаём ссылку на файл
        const url = URL.createObjectURL(blob);
        
        // Для Android WebView: пробуем открыть Intent через специальный протокол
        // Это единственный способ вызвать системное окно сохранения
        const intentUrl = `intent://${url}#Intent;scheme=file;action=android.intent.action.VIEW;type=image/jpeg;end`;
        
        // Показываем сообщение, что нужно сохранить вручную
        showStatus('⚠️ Нажмите и удерживайте изображение → "Сохранить изображение"', false);
        
        // Открываем изображение в новом окне
        const newWindow = window.open(url, '_blank');
        if (newWindow) {
            setTimeout(() => {
                newWindow.close();
            }, 1000);
        }
        
        URL.revokeObjectURL(url);
    }
    
    function updatePreview(dataUrl, name, size, format) {
        currentImageData = dataUrl;
        previewImg.src = dataUrl;
        previewImg.style.display = 'block';
        previewPlaceholder.style.display = 'none';
        fileInfoDiv.style.display = 'block';
        fileInfoDiv.innerText = `${name} • ${(size/1024/1024).toFixed(2)} MB • ${format}`;
    }
    
    function handleFile(file) {
        if (!file || !file.type.startsWith('image/')) return;
        const reader = new FileReader();
        reader.onload = (e) => {
            const format = file.type.split('/')[1].toUpperCase();
            updatePreview(e.target.result, file.name, file.size, format);
        };
        reader.readAsDataURL(file);
    }
    
    uploadZone.addEventListener('click', () => {
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = 'image/*';
        input.onchange = (e) => {
            if (e.target.files && e.target.files[0]) handleFile(e.target.files[0]);
        };
        input.click();
    });
    
    saveBtn.addEventListener('click', saveImage);
</script>
</body>
</html>
