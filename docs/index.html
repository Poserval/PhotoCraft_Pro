<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>PhotoCraft Pro — Главная</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #f9fafb;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .header {
            background: white;
            border-bottom: 1px solid #e5e7eb;
            padding: 12px 16px;
            text-align: center;
        }
        .logo { height: 120px; width: auto; object-fit: contain; }
        .slogan { text-align: center; padding: 16px 16px 0 16px; }
        .slogan.hidden { display: none; }
        .main-title {
            font-size: 20px; font-weight: 800;
            background: linear-gradient(135deg, #2563eb, #7c3aed, #db2777);
            -webkit-background-clip: text; background-clip: text; color: transparent;
            white-space: nowrap;
        }
        .formats-row { font-size: 10px; color: #9ca3af; margin-top: 6px; }
        .main-content { flex: 1; display: flex; flex-direction: column; padding: 16px; }
        .preview-wrapper { display: flex; flex-direction: column; flex: 1; position: relative; overflow: hidden; }
        .preview-area {
            background: #f3f4f6; border: 2px dashed #d1d5db; border-radius: 20px;
            aspect-ratio: 3 / 4; width: 100%; position: relative; overflow: hidden; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }
        .preview-placeholder {
            color: #6b7280; font-size: 14px; text-align: center;
            width: 100%;
        }
        .preview-image {
            width: 100%; height: 100%; object-fit: contain; display: block;
        }
        .file-info { margin-top: 12px; font-size: 12px; color: #6b7280; text-align: center; }
        .tools-row {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-top: 20px;
            margin-bottom: 20px;
        }
        .tool-card {
            background: white;
            border: 1.5px solid #e5e7eb;
            border-radius: 20px;
            padding: 16px 8px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        .tool-card:active { transform: scale(0.96); background: #f3f4f6; }
        .tool-icon { font-size: 40px; margin-bottom: 8px; }
        .tool-title { font-size: 14px; font-weight: 500; color: #1f2937; }
        .tool-desc { font-size: 11px; color: #6b7280; margin-top: 4px; }
        .disabled {
            opacity: 0.5;
            pointer-events: none;
        }
    </style>
</head>
<body>

<div class="header">
    <img src="/PhotoCraft_Pro/assets/icon-header.png" class="logo" alt="PhotoCraft Pro">
</div>

<div class="slogan" id="slogan">
    <div class="main-title">Умное редактирование фото с AI</div>
    <div class="formats-row">JPG · PNG · WEBP · GIF · BMP · TIFF · SVG</div>
</div>

<div class="main-content">
    <div class="preview-wrapper">
        <div id="uploadZone" class="preview-area">
            <div id="previewPlaceholder" class="preview-placeholder">📸 Нажмите для загрузки изображения</div>
            <img id="previewImg" class="preview-image" style="display: none;" alt="preview">
        </div>
        <div id="fileInfo" class="file-info" style="display: none;"></div>
    </div>
    
    <div class="tools-row">
        <div class="tool-card" data-tool="crop">
            <div class="tool-icon">✂️</div>
            <div class="tool-title">Кадрирование</div>
            <div class="tool-desc">Обрезка фото</div>
        </div>
        <div class="tool-card disabled" data-tool="edit">
            <div class="tool-icon">🎨</div>
            <div class="tool-title">Редактирование</div>
            <div class="tool-desc">Коррекция, цвет, эффекты</div>
        </div>
        <div class="tool-card disabled" data-tool="text">
            <div class="tool-icon">📝</div>
            <div class="tool-title">Текст</div>
            <div class="tool-desc">Добавление текста</div>
        </div>
        <div class="tool-card disabled" data-tool="remove-bg">
            <div class="tool-icon">✨</div>
            <div class="tool-title">Удаление фона</div>
            <div class="tool-desc">AI удаление фона</div>
        </div>
        <div class="tool-card disabled" data-tool="replace-bg">
            <div class="tool-icon">🖼️</div>
            <div class="tool-title">Замена фона</div>
            <div class="tool-desc">Новый фон</div>
        </div>
    </div>
</div>

<script>
    const uploadZone = document.getElementById('uploadZone');
    const previewImg = document.getElementById('previewImg');
    const previewPlaceholder = document.getElementById('previewPlaceholder');
    const fileInfoDiv = document.getElementById('fileInfo');
    const slogan = document.getElementById('slogan');
    
    let currentImageData = null;
    
    function updatePreview(dataUrl, name, size, format) {
        currentImageData = dataUrl;
        previewImg.src = dataUrl;
        previewImg.style.display = 'block';
        previewPlaceholder.style.display = 'none';
        fileInfoDiv.style.display = 'block';
        fileInfoDiv.innerText = `${name} • ${(size/1024/1024).toFixed(2)} MB • ${format}`;
        slogan.classList.add('hidden');
        
        localStorage.setItem('currentImage', dataUrl);
        localStorage.setItem('currentImageName', name);
        localStorage.setItem('currentImageSize', size);
        localStorage.setItem('currentImageFormat', format);
    }
    
    function handleFile(file) {
        if (!file || !file.type.startsWith('image/')) return;
        const reader = new FileReader();
        reader.onload = (e) => {
            const format = file.type.split('/')[1].toUpperCase();
            updatePreview(e.target.result, file.name, file.size, format);
        };
        reader.readAsDataURL(file);
    }
    
    uploadZone.addEventListener('click', () => {
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = 'image/*';
        input.onchange = (e) => { if (e.target.files && e.target.files[0]) handleFile(e.target.files[0]); };
        input.click();
    });
    
    document.querySelectorAll('.tool-card:not(.disabled)').forEach(card => {
        card.addEventListener('click', () => {
            const tool = card.dataset.tool;
            if (currentImageData) {
                window.location.href = `/PhotoCraft_Pro/docs/pages/${tool}.html`;
            } else {
                alert('Сначала загрузите изображение');
            }
        });
    });
</script>
</body>
</html>
