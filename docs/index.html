<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>PhotoCraft Pro — Кадрирование</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #f9fafb;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .header {
            background: white;
            border-bottom: 1px solid #e5e7eb;
            padding: 12px 16px;
            text-align: center;
        }
        .logo { height: 120px; width: auto; object-fit: contain; }
        .slogan { text-align: center; padding: 16px 16px 0 16px; }
        .slogan.hidden { display: none; }
        .main-title {
            font-size: 20px; font-weight: 800;
            background: linear-gradient(135deg, #2563eb, #7c3aed, #db2777);
            -webkit-background-clip: text; background-clip: text; color: transparent;
            white-space: nowrap;
        }
        .formats-row { font-size: 10px; color: #9ca3af; margin-top: 6px; }
        .main-content { flex: 1; display: flex; flex-direction: column; padding: 16px; }
        .preview-wrapper { display: flex; flex-direction: column; flex: 1; position: relative; overflow: hidden; }
        .preview-area {
            background: #f3f4f6; border: 2px dashed #d1d5db; border-radius: 20px;
            aspect-ratio: 3 / 4; width: 100%; position: relative; overflow: hidden;
        }
        .preview-placeholder {
            color: #6b7280; font-size: 14px; text-align: center;
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 100%;
        }
        .preview-image {
            width: 100%; height: 100%; object-fit: contain; display: block;
        }
        .crop-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6); pointer-events: none; z-index: 10; display: none;
        }
        .crop-frame {
            position: absolute; border: 2px solid white; box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.6);
            cursor: grab; z-index: 20; display: none;
        }
        .crop-frame:active { cursor: grabbing; }
        .crop-handle {
            position: absolute; width: 24px; height: 24px; background: white; border: 2px solid #3b82f6;
            border-radius: 6px; pointer-events: auto;
        }
        .crop-handle.nw { top: -12px; left: -12px; cursor: nw-resize; }
        .crop-handle.n { top: -12px; left: 50%; transform: translateX(-50%); cursor: n-resize; }
        .crop-handle.ne { top: -12px; right: -12px; cursor: ne-resize; }
        .crop-handle.w { top: 50%; left: -12px; transform: translateY(-50%); cursor: w-resize; }
        .crop-handle.e { top: 50%; right: -12px; transform: translateY(-50%); cursor: e-resize; }
        .crop-handle.sw { bottom: -12px; left: -12px; cursor: sw-resize; }
        .crop-handle.s { bottom: -12px; left: 50%; transform: translateX(-50%); cursor: s-resize; }
        .crop-handle.se { bottom: -12px; right: -12px; cursor: se-resize; }
        .file-info { margin-top: 12px; font-size: 12px; color: #6b7280; text-align: center; }
        .tools-row { display: flex; justify-content: center; gap: 20px; margin-top: 20px; margin-bottom: 20px; }
        .tool-icon {
            width: 60px; height: 60px; background: white; border: 1.5px solid #e5e7eb; border-radius: 20px;
            font-size: 28px; display: flex; align-items: center; justify-content: center; cursor: pointer;
        }
        .tool-icon:active { transform: scale(0.96); background: #f3f4f6; }
        button { margin-top: 16px; width: 100%; padding: 12px; background: #3b82f6; color: white; border: none; border-radius: 12px; font-size: 16px; cursor: pointer; }
    </style>
</head>
<body>

<div class="header">
    <img src="/PhotoCraft_Pro/assets/icon-header.png" class="logo" alt="PhotoCraft Pro">
</div>

<div class="slogan" id="slogan">
    <div class="main-title">Умное редактирование фото с AI</div>
    <div class="formats-row">JPG · PNG · WEBP · GIF · BMP · TIFF · SVG</div>
</div>

<div class="main-content">
    <div class="preview-wrapper">
        <div id="uploadZone" class="preview-area">
            <div id="previewPlaceholder" class="preview-placeholder">📸 Нажмите для загрузки изображения</div>
            <img id="previewImg" class="preview-image" style="display: none;" alt="preview">
            <div id="cropOverlay" class="crop-overlay"></div>
            <div id="cropFrame" class="crop-frame">
                <div class="crop-handle nw"></div><div class="crop-handle n"></div><div class="crop-handle ne"></div>
                <div class="crop-handle w"></div><div class="crop-handle e"></div>
                <div class="crop-handle sw"></div><div class="crop-handle s"></div><div class="crop-handle se"></div>
            </div>
        </div>
        <div id="fileInfo" class="file-info" style="display: none;"></div>
    </div>
    <div class="tools-row">
        <div class="tool-icon" data-menu="edit">✏️</div>
        <div class="tool-icon" data-menu="remove-bg">✂️</div>
        <div class="tool-icon" data-menu="inpaint">🖌️</div>
        <div class="tool-icon" data-menu="replace-bg">🖼️</div>
    </div>
    <button id="testCropBtn">🔧 ТЕСТ: Включить кадрирование</button>
</div>

<script>
    const uploadZone = document.getElementById('uploadZone');
    const previewImg = document.getElementById('previewImg');
    const previewPlaceholder = document.getElementById('previewPlaceholder');
    const fileInfoDiv = document.getElementById('fileInfo');
    const slogan = document.getElementById('slogan');
    const previewArea = document.getElementById('uploadZone');
    const cropOverlay = document.getElementById('cropOverlay');
    const cropFrame = document.getElementById('cropFrame');
    const testCropBtn = document.getElementById('testCropBtn');
    
    let currentImageData = null;
    let isCropActive = false;
    
    // Рамка кадрирования
    let frameRect = { x: 50, y: 50, w: 200, h: 200 };
    let activeHandle = null;
    let startX, startY, startRect;
    
    function updateFramePosition() {
        const rect = previewArea.getBoundingClientRect();
        cropFrame.style.left = frameRect.x + 'px';
        cropFrame.style.top = frameRect.y + 'px';
        cropFrame.style.width = frameRect.w + 'px';
        cropFrame.style.height = frameRect.h + 'px';
    }
    
    function initCrop() {
        const rect = previewArea.getBoundingClientRect();
        frameRect = { x: rect.width * 0.1, y: rect.height * 0.1, w: rect.width * 0.8, h: rect.height * 0.8 };
        updateFramePosition();
        cropOverlay.style.display = 'block';
        cropFrame.style.display = 'block';
        isCropActive = true;
        console.log('Кадрирование включено, рамка должна появиться');
    }
    
    function disableCrop() {
        cropOverlay.style.display = 'none';
        cropFrame.style.display = 'none';
        isCropActive = false;
        activeHandle = null;
    }
    
    function startResize(e, handle) {
        e.preventDefault();
        e.stopPropagation();
        activeHandle = handle;
        startX = e.touches ? e.touches[0].clientX : e.clientX;
        startY = e.touches ? e.touches[0].clientY : e.clientY;
        startRect = { ...frameRect };
    }
    
    function startMove(e) {
        e.preventDefault();
        e.stopPropagation();
        activeHandle = 'move';
        startX = e.touches ? e.touches[0].clientX : e.clientX;
        startY = e.touches ? e.touches[0].clientY : e.clientY;
        startRect = { ...frameRect };
    }
    
    function onResizeMove(e) {
        if (!activeHandle) return;
        e.preventDefault();
        const currentX = e.touches ? e.touches[0].clientX : e.clientX;
        const currentY = e.touches ? e.touches[0].clientY : e.clientY;
        const dx = currentX - startX;
        const dy = currentY - startY;
        const containerRect = previewArea.getBoundingClientRect();
        let newRect = { ...startRect };
        
        if (activeHandle === 'move') {
            newRect.x = Math.max(0, Math.min(startRect.x + dx, containerRect.width - startRect.w));
            newRect.y = Math.max(0, Math.min(startRect.y + dy, containerRect.height - startRect.h));
        } else {
            if (activeHandle.includes('e')) newRect.w = Math.max(50, startRect.w + dx);
            if (activeHandle.includes('w')) {
                newRect.w = Math.max(50, startRect.w - dx);
                newRect.x = startRect.x + (startRect.w - newRect.w);
            }
            if (activeHandle.includes('s')) newRect.h = Math.max(50, startRect.h + dy);
            if (activeHandle.includes('n')) {
                newRect.h = Math.max(50, startRect.h - dy);
                newRect.y = startRect.y + (startRect.h - newRect.h);
            }
            newRect.x = Math.max(0, Math.min(newRect.x, containerRect.width - newRect.w));
            newRect.y = Math.max(0, Math.min(newRect.y, containerRect.height - newRect.h));
        }
        frameRect = newRect;
        updateFramePosition();
    }
    
    function endResize() { activeHandle = null; }
    
    // Загрузка фото
    function updatePreview(dataUrl, name, size, format) {
        currentImageData = dataUrl;
        previewImg.src = dataUrl;
        previewImg.style.display = 'block';
        previewPlaceholder.style.display = 'none';
        fileInfoDiv.style.display = 'block';
        fileInfoDiv.innerText = `${name} • ${(size/1024/1024).toFixed(2)} MB • ${format}`;
        slogan.classList.add('hidden');
        disableCrop();
    }
    
    function handleFile(file) {
        if (!file || !file.type.startsWith('image/')) return;
        const reader = new FileReader();
        reader.onload = (e) => {
            const format = file.type.split('/')[1].toUpperCase();
            updatePreview(e.target.result, file.name, file.size, format);
        };
        reader.readAsDataURL(file);
    }
    
    uploadZone.addEventListener('click', () => {
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = 'image/*';
        input.onchange = (e) => { if (e.target.files && e.target.files[0]) handleFile(e.target.files[0]); };
        input.click();
    });
    
    // Кнопка для теста кадрирования
    testCropBtn.addEventListener('click', () => {
        if (currentImageData) {
            initCrop();
        } else {
            alert('Сначала загрузите изображение');
        }
    });
    
    // Обработчики для рамки
    function bindEvents() {
        document.querySelectorAll('.crop-handle').forEach(handle => {
            handle.addEventListener('touchstart', (e) => startResize(e, handle.classList[1]));
            handle.addEventListener('mousedown', (e) => startResize(e, handle.classList[1]));
        });
        cropFrame.addEventListener('touchstart', startMove);
        cropFrame.addEventListener('mousedown', startMove);
        window.addEventListener('touchmove', onResizeMove);
        window.addEventListener('mousemove', onResizeMove);
        window.addEventListener('touchend', endResize);
        window.addEventListener('mouseup', endResize);
    }
    
    bindEvents();
    
    // Кнопки меню (заглушки)
    document.querySelectorAll('.tool-icon').forEach(btn => {
        btn.addEventListener('click', () => {
            alert('Функция в разработке. Используйте кнопку "ТЕСТ: Включить кадрирование"');
        });
    });
</script>
</body>
</html>
