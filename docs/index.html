<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>PhotoCraft Pro — Кадрирование</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
        body { font-family: system-ui, sans-serif; background: #f3f4f6; min-height: 100vh; padding: 20px; }
        .container { max-width: 500px; margin: 0 auto; background: white; border-radius: 24px; padding: 20px; }
        .title { text-align: center; margin-bottom: 16px; }
        .crop-container { position: relative; background: #1f2937; border-radius: 16px; overflow: hidden; aspect-ratio: 3 / 4; width: 100%; touch-action: none; }
        .crop-container img { width: 100%; height: 100%; object-fit: contain; display: block; }
        .crop-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.6); pointer-events: none; z-index: 10; display: none; }
        .crop-frame { position: absolute; border: 2px solid white; box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.6); cursor: grab; z-index: 20; display: none; }
        .crop-frame:active { cursor: grabbing; }
        .handle {
            position: absolute; width: 24px; height: 24px; background: white; border: 2px solid #3b82f6;
            border-radius: 6px; pointer-events: auto;
        }
        .handle.nw { top: -12px; left: -12px; cursor: nw-resize; }
        .handle.n { top: -12px; left: 50%; transform: translateX(-50%); cursor: n-resize; }
        .handle.ne { top: -12px; right: -12px; cursor: ne-resize; }
        .handle.w { top: 50%; left: -12px; transform: translateY(-50%); cursor: w-resize; }
        .handle.e { top: 50%; right: -12px; transform: translateY(-50%); cursor: e-resize; }
        .handle.sw { bottom: -12px; left: -12px; cursor: sw-resize; }
        .handle.s { bottom: -12px; left: 50%; transform: translateX(-50%); cursor: s-resize; }
        .handle.se { bottom: -12px; right: -12px; cursor: se-resize; }
        .info { margin-top: 16px; font-size: 12px; color: #6b7280; text-align: center; }
        button { margin-top: 16px; width: 100%; padding: 12px; background: #3b82f6; color: white; border: none; border-radius: 12px; font-size: 16px; cursor: pointer; }
        .file-info { margin-top: 8px; font-size: 11px; color: #9ca3af; text-align: center; }
    </style>
</head>
<body>
<div class="container">
    <div class="title"><h1>Кадрирование — свободная рамка</h1></div>
    <div id="cropContainer" class="crop-container">
        <img id="image" src="" alt="Изображение" style="display: none;">
        <div id="overlay" class="crop-overlay"></div>
        <div id="frame" class="crop-frame">
            <div class="handle nw"></div><div class="handle n"></div><div class="handle ne"></div>
            <div class="handle w"></div><div class="handle e"></div>
            <div class="handle sw"></div><div class="handle s"></div><div class="handle se"></div>
        </div>
    </div>
    <div class="file-info" id="fileInfo"></div>
    <button id="uploadBtn">📸 Выбрать изображение</button>
    <div class="info">👇 Потяните за уголки рамки</div>
</div>

<script>
    const container = document.getElementById('cropContainer');
    const image = document.getElementById('image');
    const overlay = document.getElementById('overlay');
    const frame = document.getElementById('frame');
    const fileInfo = document.getElementById('fileInfo');
    const uploadBtn = document.getElementById('uploadBtn');

    let isCropActive = false;
    let frameRect = { x: 50, y: 50, w: 200, h: 200 };
    let activeHandle = null;
    let startX, startY, startRect;

    function loadImage(file) {
        if (!file || !file.type.startsWith('image/')) return;
        const reader = new FileReader();
        reader.onload = (e) => {
            image.src = e.target.result;
            image.style.display = 'block';
            fileInfo.textContent = `${file.name} • ${(file.size / 1024 / 1024).toFixed(2)} MB`;
            image.onload = () => initCrop();
        };
        reader.readAsDataURL(file);
    }

    function initCrop() {
        const rect = container.getBoundingClientRect();
        frameRect = { x: rect.width * 0.1, y: rect.height * 0.1, w: rect.width * 0.8, h: rect.height * 0.8 };
        updateFramePosition();
        overlay.style.display = 'block';
        frame.style.display = 'block';
        isCropActive = true;
    }

    function updateFramePosition() {
        frame.style.left = frameRect.x + 'px';
        frame.style.top = frameRect.y + 'px';
        frame.style.width = frameRect.w + 'px';
        frame.style.height = frameRect.h + 'px';
    }

    function startResize(e, handle) {
        e.preventDefault();
        e.stopPropagation();
        activeHandle = handle;
        startX = e.touches ? e.touches[0].clientX : e.clientX;
        startY = e.touches ? e.touches[0].clientY : e.clientY;
        startRect = { ...frameRect };
    }

    function startMove(e) {
        e.preventDefault();
        e.stopPropagation();
        activeHandle = 'move';
        startX = e.touches ? e.touches[0].clientX : e.clientX;
        startY = e.touches ? e.touches[0].clientY : e.clientY;
        startRect = { ...frameRect };
    }

    function onResize(e) {
        if (!activeHandle) return;
        e.preventDefault();
        const currentX = e.touches ? e.touches[0].clientX : e.clientX;
        const currentY = e.touches ? e.touches[0].clientY : e.clientY;
        const dx = currentX - startX;
        const dy = currentY - startY;
        const containerRect = container.getBoundingClientRect();
        let newRect = { ...startRect };
        
        if (activeHandle === 'move') {
            newRect.x = Math.max(0, Math.min(startRect.x + dx, containerRect.width - startRect.w));
            newRect.y = Math.max(0, Math.min(startRect.y + dy, containerRect.height - startRect.h));
        } else {
            if (activeHandle.includes('e')) newRect.w = Math.max(50, startRect.w + dx);
            if (activeHandle.includes('w')) {
                newRect.w = Math.max(50, startRect.w - dx);
                newRect.x = startRect.x + (startRect.w - newRect.w);
            }
            if (activeHandle.includes('s')) newRect.h = Math.max(50, startRect.h + dy);
            if (activeHandle.includes('n')) {
                newRect.h = Math.max(50, startRect.h - dy);
                newRect.y = startRect.y + (startRect.h - newRect.h);
            }
            newRect.x = Math.max(0, Math.min(newRect.x, containerRect.width - newRect.w));
            newRect.y = Math.max(0, Math.min(newRect.y, containerRect.height - newRect.h));
        }
        frameRect = newRect;
        updateFramePosition();
    }

    function endResize() { activeHandle = null; }

    function bindEvents() {
        document.querySelectorAll('.handle').forEach(handle => {
            handle.addEventListener('touchstart', (e) => startResize(e, handle.classList[1]));
            handle.addEventListener('mousedown', (e) => startResize(e, handle.classList[1]));
        });
        frame.addEventListener('touchstart', startMove);
        frame.addEventListener('mousedown', startMove);
        window.addEventListener('touchmove', onResize);
        window.addEventListener('mousemove', onResize);
        window.addEventListener('touchend', endResize);
        window.addEventListener('mouseup', endResize);
    }

    uploadBtn.addEventListener('click', () => {
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = 'image/*';
        input.onchange = (e) => { if (e.target.files && e.target.files[0]) loadImage(e.target.files[0]); };
        input.click();
    });

    bindEvents();
</script>
</body>
</html>
