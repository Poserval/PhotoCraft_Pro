<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>PhotoCraft Pro — AI Photo Studio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #f9fafb;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            touch-action: pan-x pan-y;
        }

        .header {
            background: white;
            border-bottom: 1px solid #e5e7eb;
            padding: 12px 16px;
            text-align: center;
            flex-shrink: 0;
        }
        .logo {
            height: 120px;
            width: auto;
            object-fit: contain;
        }

        .slogan {
            text-align: center;
            padding: 16px 16px 0 16px;
            flex-shrink: 0;
            transition: all 0.2s;
        }
        .slogan.hidden {
            display: none;
        }
        .main-title {
            font-size: 20px;
            font-weight: 800;
            background: linear-gradient(135deg, #2563eb, #7c3aed, #db2777);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            white-space: nowrap;
        }
        .formats-row {
            font-size: 10px;
            color: #9ca3af;
            margin-top: 6px;
            letter-spacing: 0.3px;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 16px;
        }

        .preview-wrapper {
            display: flex;
            flex-direction: column;
            flex: 1;
            position: relative;
            overflow: hidden;
        }
        
        .preview-area {
            background: #f3f4f6;
            border: 2px dashed #d1d5db;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            aspect-ratio: 3 / 4;
            width: 100%;
            overflow: hidden;
            position: relative;
            touch-action: none;
        }
        .preview-area:active {
            background: #e5e7eb;
        }
        
        .preview-placeholder {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            color: #6b7280;
            text-align: center;
            padding: 20px;
        }
        .preview-placeholder-icon {
            font-size: 48px;
            opacity: 0.6;
        }
        .preview-placeholder-text {
            font-size: 16px;
            font-weight: 500;
            color: #9ca3af;
        }
        .preview-placeholder-hint {
            font-size: 12px;
            color: #cbd5e1;
            margin-top: 4px;
        }
        .image-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .preview-image {
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            object-fit: contain;
            border-radius: 18px;
            display: block;
            transform-origin: center center;
            cursor: grab;
            transition: transform 0.05s ease-out;
        }
        .preview-image:active {
            cursor: grabbing;
        }
        .file-info {
            margin-top: 12px;
            font-size: 12px;
            color: #6b7280;
            text-align: center;
        }

        .tools-row {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
            margin-bottom: 20px;
            flex-shrink: 0;
        }
        .tool-icon {
            width: 60px;
            height: 60px;
            background: white;
            border: 1.5px solid #e5e7eb;
            border-radius: 20px;
            font-size: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
            user-select: none;
            touch-action: manipulation;
        }
        .tool-icon:active {
            transform: scale(0.96);
            background: #f3f4f6;
        }
        .tool-icon.disabled {
            opacity: 0.5;
            pointer-events: none;
        }
    </style>
</head>
<body>

<div class="header">
    <img src="/PhotoCraft_Pro/assets/icon-header.png" class="logo" alt="PhotoCraft Pro">
</div>

<div class="slogan" id="slogan">
    <div class="main-title">Умное редактирование фото с AI</div>
    <div class="formats-row">JPG · PNG · WEBP · GIF · BMP · TIFF · SVG</div>
</div>

<div class="main-content">
    <div class="preview-wrapper">
        <div id="uploadZone" class="preview-area">
            <div id="previewPlaceholder" class="preview-placeholder">
                <div class="preview-placeholder-icon">📸</div>
                <div class="preview-placeholder-text">Нажмите для загрузки изображения</div>
                <div class="preview-placeholder-hint">Поддерживаются JPG, PNG, WEBP, GIF, BMP, TIFF, SVG</div>
            </div>
            <div class="image-container" style="display: none;" id="imageContainer">
                <img id="previewImg" class="preview-image" alt="preview">
            </div>
        </div>
        <div id="fileInfo" class="file-info" style="display: none;"></div>
    </div>

    <div class="tools-row">
        <div class="tool-icon" data-tool="edit">✏️</div>
        <div class="tool-icon disabled" data-tool="crop">✂️</div>
        <div class="tool-icon disabled" data-tool="inpaint">🖌️</div>
        <div class="tool-icon disabled" data-tool="replace-bg">🖼️</div>
    </div>
</div>

<script>
    const uploadZone = document.getElementById('uploadZone');
    const previewPlaceholder = document.getElementById('previewPlaceholder');
    const imageContainer = document.getElementById('imageContainer');
    const previewImg = document.getElementById('previewImg');
    const fileInfoDiv = document.getElementById('fileInfo');
    const slogan = document.getElementById('slogan');
    const previewArea = document.getElementById('uploadZone');
    
    let currentImageData = null;
    
    // === МАСШТАБИРОВАНИЕ ===
    let currentScale = 1;
    let currentTranslateX = 0;
    let currentTranslateY = 0;
    let initialDistance = 0;
    let initialScale = 1;
    let isZooming = false;
    let isDragging = false;
    let dragStartX = 0;
    let dragStartY = 0;
    
    function getScaledImageRect() {
        if (!previewImg.complete || previewImg.naturalWidth === 0) return { width: 0, height: 0 };
        const naturalWidth = previewImg.naturalWidth, naturalHeight = previewImg.naturalHeight;
        const containerRect = previewArea.getBoundingClientRect();
        const containerAspect = containerRect.width / containerRect.height;
        const imageAspect = naturalWidth / naturalHeight;
        let baseWidth, baseHeight;
        if (imageAspect > containerAspect) {
            baseWidth = containerRect.width;
            baseHeight = containerRect.width / imageAspect;
        } else {
            baseHeight = containerRect.height;
            baseWidth = containerRect.height * imageAspect;
        }
        return { width: baseWidth * currentScale, height: baseHeight * currentScale };
    }
    
    function clampTranslate() {
        const containerRect = previewArea.getBoundingClientRect();
        const { width: scaledWidth, height: scaledHeight } = getScaledImageRect();
        let maxX = Math.max(0, (scaledWidth - containerRect.width) / 2);
        let maxY = Math.max(0, (scaledHeight - containerRect.height) / 2);
        if (scaledWidth <= containerRect.width) currentTranslateX = 0;
        else currentTranslateX = Math.max(-maxX, Math.min(maxX, currentTranslateX));
        if (scaledHeight <= containerRect.height) currentTranslateY = 0;
        else currentTranslateY = Math.max(-maxY, Math.min(maxY, currentTranslateY));
        previewImg.style.transform = `translate(${currentTranslateX}px, ${currentTranslateY}px) scale(${currentScale})`;
    }
    
    function resetTransform() {
        currentScale = 1;
        currentTranslateX = 0;
        currentTranslateY = 0;
        previewImg.style.transform = `translate(0px, 0px) scale(1)`;
    }
    
    function zoomFromCenter(newScale) {
        if (!previewImg.complete || previewImg.naturalWidth === 0) return;
        const newScaleClamped = Math.max(1, newScale);
        if (newScaleClamped === currentScale) return;
        const scaleRatio = newScaleClamped / currentScale;
        currentTranslateX = currentTranslateX * scaleRatio;
        currentTranslateY = currentTranslateY * scaleRatio;
        currentScale = newScaleClamped;
        previewImg.style.transform = `translate(${currentTranslateX}px, ${currentTranslateY}px) scale(${currentScale})`;
        clampTranslate();
    }
    
    function handleTouchStart(e) {
        if (!currentImageData) return;
        e.preventDefault();
        if (e.touches.length === 2) {
            const dx = e.touches[0].clientX - e.touches[1].clientX;
            const dy = e.touches[0].clientY - e.touches[1].clientY;
            initialDistance = Math.hypot(dx, dy);
            initialScale = currentScale;
            isZooming = true;
            isDragging = false;
        } else if (e.touches.length === 1) {
            if (currentScale > 1) {
                isDragging = true;
                dragStartX = e.touches[0].clientX - currentTranslateX;
                dragStartY = e.touches[0].clientY - currentTranslateY;
            }
        }
    }
    
    function handleTouchMove(e) {
        if (!currentImageData) return;
        if (!isZooming && !isDragging) return;
        e.preventDefault();
        if (isZooming && e.touches.length === 2) {
            const dx = e.touches[0].clientX - e.touches[1].clientX;
            const dy = e.touches[0].clientY - e.touches[1].clientY;
            const newDistance = Math.hypot(dx, dy);
            zoomFromCenter(initialScale * (newDistance / initialDistance));
        } else if (isDragging && e.touches.length === 1 && currentScale > 1) {
            currentTranslateX = e.touches[0].clientX - dragStartX;
            currentTranslateY = e.touches[0].clientY - dragStartY;
            clampTranslate();
        }
    }
    
    function handleTouchEnd(e) {
        isZooming = false;
        isDragging = false;
        if (currentScale < 1) resetTransform();
        setTimeout(() => clampTranslate(), 50);
    }
    
    // === ЗАГРУЗКА ФОТО ===
    function updatePreview(dataUrl, name, size, format) {
        currentImageData = dataUrl;
        previewImg.src = dataUrl;
        previewImg.style.display = 'block';
        imageContainer.style.display = 'flex';
        previewPlaceholder.style.display = 'none';
        fileInfoDiv.style.display = 'block';
        fileInfoDiv.innerText = `${name} • ${(size/1024/1024).toFixed(2)} MB • ${format}`;
        slogan.classList.add('hidden');
        resetTransform();
        
        localStorage.setItem('currentImage', dataUrl);
        localStorage.setItem('currentImageName', name);
        localStorage.setItem('currentImageSize', size);
        localStorage.setItem('currentImageFormat', format);
    }
    
    function handleFile(file) {
        if (!file || !file.type.startsWith('image/')) return;
        const reader = new FileReader();
        reader.onload = (e) => {
            const format = file.type.split('/')[1].toUpperCase();
            updatePreview(e.target.result, file.name, file.size, format);
        };
        reader.readAsDataURL(file);
    }
    
    uploadZone.addEventListener('click', () => {
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = 'image/*';
        input.onchange = (e) => { if (e.target.files && e.target.files[0]) handleFile(e.target.files[0]); };
        input.click();
    });
    
    previewImg.addEventListener('touchstart', handleTouchStart);
    previewImg.addEventListener('touchmove', handleTouchMove);
    previewImg.addEventListener('touchend', handleTouchEnd);
    
    // Переход на страницу редактирования (кадрирование)
    document.querySelectorAll('.tool-icon').forEach(btn => {
        btn.addEventListener('click', () => {
            const tool = btn.dataset.tool;
            if (tool === 'edit') {
                if (currentImageData) {
                    window.location.href = 'pages/crop.html';
                } else {
                    alert('Сначала загрузите изображение');
                }
            }
        });
    });
</script>
</body>
</html>
